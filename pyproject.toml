# Tool configuration only. This repository is not (yet) an installable
# distribution; see ADR-0001, "Open questions".
#
# Toolchain decided in ADR-0003: ruff format, ruff check, mypy --strict,
# pydantic v2 for schema validation, pytest as the runner.

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["client", "server", "protocol", "tools", "tests"]
exclude = [".venv", "data", "docs"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # import sorting
    "B",    # bugbear
    "C4",   # comprehensions
    "UP",   # pyupgrade
    "SIM",  # simplify
    "PTH",  # use pathlib
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["protocol", "client", "server", "tools", "tests"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["."]
exclude = "(^\\.venv/|^data/)"

# Third-party packages without bundled type information get an explicit
# per-module exemption here rather than a blanket suppression (ADR-0003).

[[tool.mypy.overrides]]
# libsamplerate bindings ship no stubs. Wrapped behind the ResamplerBackend
# protocol in client/resampler.py, so the untyped surface is one module wide.
module = ["samplerate"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PySide6 ships type hints but mypy --strict trips over Qt's Python bindings
# in ways that say nothing about this project. The UI logic worth checking
# lives in client/ui/timeline.py and client/ui/updates.py, which have no Qt
# import at all - which is the same testability argument ADR-0013 made for
# keeping the network off Qt.
module = ["PySide6.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# PyAudioWPatch ships no stubs. The slice this project uses is declared as
# the PyAudioLike protocol in client/devices.py.
module = ["pyaudiowpatch"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "real_ml: category A - real recording and real models",
    "conformance: category B - labelled protocol/security/persistence vectors",
    "replay: category C - real captured WebSocket traffic replay",
    "server_gate: requires the H100 pod; never run on the dev machine",
]
